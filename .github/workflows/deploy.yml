name: Deploy site (cursed + portfolio)

# Builds BOTH apps from THIS single branch into one GitHub Pages output:
#   /            -> apps/cursed     (the "cursed" YouTube site)
#   /portfolio/  -> apps/portfolio  (the real portfolio)
# The career timeline and project cards live once in /shared and are compiled
# into both apps, so editing them in one place updates both sites.
# If either build fails, nothing is deployed, so the live site is never broken.

on:
  push:
    branches: [combined, main]
  workflow_dispatch:

permissions:
  contents: write

# Never run two deploys at once.
concurrency:
  group: deploy-gh-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build cursed site -> root (base-href /)
        working-directory: apps/cursed
        run: |
          npm ci
          npx ng build --configuration production --base-href=/

      - name: Build portfolio -> /portfolio/ (base-href /portfolio/)
        working-directory: apps/portfolio
        run: |
          npm ci
          npx ng build --configuration production --base-href=/portfolio/

      - name: Assemble combined output
        run: |
          set -e
          rm -rf out
          mkdir -p out
          # cursed site at the root
          cp -a apps/cursed/dist/website/. out/
          # portfolio under /portfolio/
          mkdir -p out/portfolio
          cp -a apps/portfolio/dist/website/. out/portfolio/
          # custom domain
          echo "evan-goldman.com" > out/CNAME
          # SPA deep-link fallback for the root (cursed) app's path-based routes
          cp out/index.html out/404.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: 'Deploy combined site (cursed + /portfolio) [skip ci]'
